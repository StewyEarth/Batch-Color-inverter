<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
    <title>Batch Color Inverter</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
</head>
<body>
    <img src="assets/img/Logo.png" id="logo" alt="Batch Inverter Logo" id="logo">
        <div id="backgroundControls">
      <label id="transparentBackground-label">
        Use transparent background:
        <input type="checkbox" id="transparentBackground-checkbox" checked>
      </label>
      <label id="bgcolor-label" class="hidden">
        Background color: 
        <input type="color" id="bgcolor-picker" value="#000000">
      </label>
    </div>
    <p id="transparency-info" class="disclaimer">(Transparency & background color only works with transparent PNGs)</p>
    <label id="drop-zone">
    Drop images here, or click to begin
    <input type="file" id="file-input" multiple accept="image/*" />
    </label>
    <p id="disclaimer" class="disclaimer">Pictures are not uploaded or saved to any server; all processing is done locally on your device.</p>
    <div id="preview"></div>
    <div id="filename-options">
      <label id="rename-files-label" class="hidden">
        <input type="checkbox" id="rename-files-checkbox">
        Save using sequential filenames (image-1.png, image-2.png, etc.)
      </label>
    </div>
    <div id="customPrefix">
    <label id="use-custom-prefix-label" class="hidden">
        <input type="checkbox" id="use-custom-prefix-checkbox">
        Use custom prefix for filenames (instead of "image")
      </label>
      <label id="custom-fileprefix-label" class="hidden">
        File prefix:
        <input type="text" id="custom-fileprefix-input" placeholder="image" value="image">
      </label>
    </div>
    <div id="controlButtons" class="hidden">
        <button id="clear-btn">Clear</button>
        <button id="download-btn">Download all</button>
        <div id="download-progress-container">
          <div id="download-progress-bar"></div>
        </div>
    </div>
    <div id="image-modal" class="hidden">
      <div id="modal-content">
        <span id="close-modal">&times;</span>
        <button id="prev-canvas" class="modal-nav">&#8249;</button>
        <canvas id="modal-canvas"></canvas>
        <button id="next-canvas" class="modal-nav">&#8250;</button>
      </div>
    </div>
    <div id="crop-overlay" class="hidden">
      <div>
        <canvas id="crop-canvas"></canvas>
        <div id="crop-controls">
          <button id="crop-confirm">Crop/Save</button>
          <button id="crop-cancel">Cancel</button>
        </div>
        <div id="crop-level-controls">
          <label>
            Blackpoint
            <input type="range" id="blackpoint-slider" min="0" max="254" value="0" step="1">
            <span id="blackpoint-value">0</span>
          </label>
          <label>
            Whitepoint
            <input type="range" id="whitepoint-slider" min="1" max="255" value="255" step="1">
            <span id="whitepoint-value">255</span>
          </label>
        </div>
      </div>
    </div>
    <footer id="footer-credit">
      &copy; Made by Scoopdewoo
    </footer>
</body>
  <script src="assets/js/script.js"></script>
</html>
